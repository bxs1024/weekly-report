name: 全球互联网动态情报站

# 防止重复并发：新的 scheduled run 启动时，取消还在跑的旧 run
#
# ⚠️ 自取消风险核查（2026-10-07）：`on.push.paths` 只列了 scripts/*.py、
# scripts/template.html、.github/workflows/*.yml，**data/ 与 docs/ 不在其中**。
# 所以下面两个 job 的自动提交（git add data/ / docs/）不会触发新的 push 运行，
# 也就不会取消自己。真正会自取消的是「人工推代码上线」那一刻——挑非采集时段推即可。
concurrency:
  group: intelligence-station
  cancel-in-progress: true

on:
  # 每天两次采集：02:00 北京时间早采，09:00 北京时间补采
  # 注意：workflow 运行时间只代表采集时点，页面展示仍按事件日期和成熟批次计算。
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 1 * * *'
  # 模板/脚本/workflow 变更时自动运行
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'scripts/template.html'
      - '.github/workflows/*.yml'
  # 手动触发
  repository_dispatch:
    types: [rss-test]
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - html-only
          - rss-test

jobs:
  # ─────────────────────────────────────────────────────────────
  # job 1：采集 + 数据落库（数据检查点）
  #
  # 为什么拆出来（2026-10-07 实测）：原来采集、渲染、提交挤在一个 job，且
  # 「Commit and push」排在渲染**之后**。渲染在 CI 上要 17–33 分钟（RSS 16–24
  # 分钟），合计长期贴着 60 分钟 job 上限 → 一超时整个 job 被杀，提交步骤直接
  # skipped，**当天采集的数据全部丢失**。这才是数据断档（9-26/9-28/9-30/10-04/
  # 10-05/10-07）的直接原因——不是 AI 慢，也不是运行之间相互取消（25 次 cancelled
  # 全部卡满 60.3 分钟，是超时）。
  #
  # 现在：采集完立刻把 data/ 提交并推送。job 级超时到点杀进程，但**已完成的步骤
  # 是算数的**——数据推上去就保住了。渲染失败只影响页面，不再吞掉数据。
  # ─────────────────────────────────────────────────────────────
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # push 代码时门控：跑全部离线测试，任一失败阻断，不进入采集
      - name: Run offline tests (gate on code change)
        if: github.event_name == 'push'
        run: |
          echo "=== 运行离线测试（push 门控）==="
          FAILED=0
          for test in scripts/test_*.py; do
            case "$test" in
              scripts/test_rss.py|scripts/test_google_news.py)
                echo "跳过网络测试: $test"
                continue
                ;;
            esac
            echo "--- 运行 $test ---"
            if ! python "$test"; then
              echo "❌ 测试失败: $test"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "离线测试存在失败，阻断进入采集流程"
            exit 1
          fi
          echo "全部离线测试通过 ✅"

      - name: Fetch and analyze news
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'html-only'
        run: |
          set +e
          # 预检：测试关键 RSS 信源在 GitHub Actions 中的可达性
          echo "=== RSS 信源可达性预检 ==="
          SOURCES=(
            "https://techcrunch.com/feed/"
            "https://tech.eu/feed/"
            "https://www.techinasia.com/feed"
            "https://wamda.com/feed/"
            "https://latamlist.com/feed/"
            "https://inc42.com/feed/"
            "https://www.uktech.news/feed"
            "https://weetracker.com/feed/"
          )
          ACCESSIBLE=0
          for src in "${SOURCES[@]}"; do
            # 单个源 403/超时只打警告，不中断流程（curl 失败 exit 非零，用 || true 容错）
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$src" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              echo "✅ $CODE $src"
              ACCESSIBLE=$((ACCESSIBLE+1))
            else
              echo "❌ $CODE $src"
            fi
          done
          echo "可达: $ACCESSIBLE/${#SOURCES[@]}"
          if [ $ACCESSIBLE -eq 0 ]; then
            echo "⚠️  所有 RSS 信源不可达，跳过采集（可能有网络限制）"
            echo '{}' > data/events.json
          else
            echo "=== 方舟 V4 Flash API 可用性检测（主，降本首选）==="
            RESP=$(curl -s -w "\n%{http_code}" --max-time 15 -X POST "https://ark.cn-beijing.volces.com/api/v3/chat/completions" \
              -H "Authorization: Bearer ${ARK_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"model":"'"${ARK_MODEL:-ep-20260827101830-qgtm4}"'","messages":[{"role":"user","content":"hi"}],"stream":false}')
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -c 300)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ 方舟 V4 Flash API 可用"
            else
              echo "⚠️ 方舟 V4 Flash API 失败 (HTTP $HTTP_CODE): $BODY"
              echo "=== DeepSeek API 可用性检测（备用）==="
              RESP=$(curl -s -w "\n%{http_code}" --max-time 15 -X POST "https://api.deepseek.com/v1/chat/completions" \
                -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
                -H "Content-Type: application/json" \
                -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"hi"}],"stream":false}')
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | head -c 300)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ DeepSeek API 可用"
              else
                echo "⚠️ DeepSeek API 失败 (HTTP $HTTP_CODE): $BODY"
                echo "=== 豆包 API 可用性检测（兜底）==="
                RESP=$(curl -s -w "\n%{http_code}" --max-time 15 -X POST "https://ark.cn-beijing.volces.com/api/v3/chat/completions" \
                  -H "Authorization: Bearer $DOUBAO_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d '{"model":"ep-20260409223830-dnt5b","messages":[{"role":"user","content":"hi"}],"stream":false}')
                HTTP_CODE=$(echo "$RESP" | tail -1)
                BODY=$(echo "$RESP" | head -c 300)
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "✅ 豆包 API 可用"
                else
                  echo "❌ 豆包 API 失败 (HTTP $HTTP_CODE): $BODY"
                fi
              fi
            fi
            start=$(date +%s)
            python -u scripts/fetch_news.py
            rc=$?
            echo "⏱ 采集+分析 用时 $(( $(date +%s) - start )) 秒（exit=$rc）"
            [ $rc -ne 0 ] && exit $rc
            python -u scripts/check_event_quality.py --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)" --max-repair-ratio 0.6 || true
          fi
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}

      - name: Debug environment
        run: |
          python --version
          python -c "import jinja2; print('Jinja2:', jinja2.__version__)"
          python -c "import sys; print(sys.path)"
          cat data/events.json | head -c 1000

      # 修复历史「问题事件」（reason 为空/含"暂不可用"），只针对有问题的，非全量重跑
      - name: Repair stale analysis
        run: python scripts/repair_stale_analysis.py || echo "⚠️ 问题事件修复失败，本次跳过（不影响采集）"
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # ★ 数据检查点：采集数据先落库，不等渲染。
      # 只提交 data/——生成页面（docs/）交给 render job，两者解耦。
      # data/archive、data/.cache、data/ai_receipts.json 已被 .gitignore 排除。
      - name: Commit collected data (checkpoint)
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ -f "data/events.json" ]; then
            EVENT_COUNT=$(python -c "import json,sys;d=json.load(open('data/events.json'));print(len(d.get('$TODAY',[])))" 2>/dev/null || echo "0")
            echo "今日采集：$EVENT_COUNT 条"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            COMMIT_MSG="data: 采集 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ 数据已落库: $COMMIT_MSG"
          fi

  # ─────────────────────────────────────────────────────────────
  # job 2：渲染（HTML + RSS）+ 页面落库
  #
  # 渲染拿独立预算（90 分钟），不再和采集抢同一个 60 分钟闹钟。
  # HTML 与 RSS 同 job 顺序执行：RSS 复用 HTML 落下的展示上下文缓存
  # （data/.cache/rss_context.json），避免整站上下文装配跑两遍——
  # 本地实测 build_display_context 单次约 25 秒，是渲染里最大的一块固定成本。
  # ─────────────────────────────────────────────────────────────
  render:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      # 无缓冲输出：原渲染日志全挤在最后一秒，导致无法定位耗时热点
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 同步到 collect 刚推上去的最新 main，否则渲染的是触发时的旧数据
      - name: Sync to latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate HTML
        run: |
          set +e
          start=$(date +%s)
          python -u scripts/generate_html.py --force
          rc=$?
          echo "⏱ Generate HTML 用时 $(( $(date +%s) - start )) 秒（exit=$rc）"
          exit $rc
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}

      - name: Generate RSS feed
        run: |
          set +e
          start=$(date +%s)
          python -u generate_feed.py
          rc=$?
          echo "⏱ Generate RSS 用时 $(( $(date +%s) - start )) 秒（exit=$rc）"
          exit $rc

      - name: Verify output
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "ERROR: docs/index.html 未生成"
            exit 1
          fi
          SIZE=$(wc -c < docs/index.html)
          echo "HTML 文件大小: $SIZE bytes"
          if [ "$SIZE" -lt 5000 ]; then
            echo "WARNING: HTML 文件过小，可能生成失败"
            exit 1
          fi

      # 页面 + 渲染期更新的编辑层缓存一起落库（data/editorial_cache.json 由渲染写入）
      - name: Commit generated pages
        run: |
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            COMMIT_MSG="Update $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git commit -m "$COMMIT_MSG"
            git push
            echo "提交成功: $COMMIT_MSG"
          fi

  rss-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rss-test')
    # push 事件不触发 rss-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Test Google News RSS
        run: python scripts/test_rss.py

  # 采集后自动健康检查：必须等渲染提交完，否则读的是旧数据会误报
  health-check:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # html-only 模式不采集新数据，跳过健康检查
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'html-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # update job 刚提交并推送了新页面，这里同步到最新 main，否则读的是触发时的旧页面
      # 会造成「更新日志 V4.x 未出现在页面」的误报
      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Run health check
        run: |
          echo "=== 数据健康检查（strict）==="
          python scripts/check_data_health.py --quick --strict \
            --min-must-coverage 0.75 \
            --max-failed-observation-points 2 \
            --max-repair-ratio 0.9
          echo "健康检查通过 ✅"

  notify-failure:
    needs: [collect, render, health-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否已有未关闭告警
        id: check-issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: undefined,
              per_page: 50
            });
            const existing = issues.find(i => i.title.includes('[自动告警]'));
            console.log('::set-output name=has_issue::' + (existing ? 'true' : 'false'));
            if (existing) console.log('已有未关闭告警: ' + existing.number);

      - name: 创建告警 Issue
        if: steps.check-issue.outputs.has_issue != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[自动告警] 情报站更新失败 — ${new Date().toISOString().slice(0,10)}`,
              body: `工作流运行失败，请检查日志：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
            console.log('已创建告警 Issue')
