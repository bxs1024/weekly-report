name: AIHOT 热点与模型榜

# ─────────────────────────────────────────────────────────────
# 职责边界（2026-10-08 重划，第一性原理：外部依赖必然失效，失效不得外溢）
#
# 本 workflow **只抓数据、只提交 data/**，不生成也不提交页面。
# 页面统一由 update.yml（主采集）生成——它渲染时会读取这里落库的最新榜单数据。
#
# 为什么这样切：
#   改版前本 workflow 也会 `Generate HTML --force` 并把整个 docs/ 提交回去，
#   与主采集争抢同一个 docs/index.html；且渲染在旧代码下要 17–33 分钟，
#   30 分钟 job 超时被杀 → 连数据都提交不了（实测最近 12 次运行全部失败）。
#   切干净之后：两个 workflow 永不争抢文件，AIHOT 板块彻底无法影响主流程。
#
# 代价：榜单上线时间取决于主采集的下一次渲染（每天 2 次，最长约 6 小时）。
# ─────────────────────────────────────────────────────────────

# 同一 workflow 内防重复：新 run 启动时取消还在跑的旧 run
concurrency:
  group: aihot-data
  cancel-in-progress: true

on:
  # 北京时间 08:00 / 20:00（GitHub Actions schedule 用 UTC，北京 = UTC+8）
  # 与主采集（北京 02:00 / 09:00）错开
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # AIHOT 热点：按天归档到 data/aihot_hot/YYYY-MM-DD.json + 更新当前快照。
      # 不加「失败就忽略」的兜底：抓不到就让它失败（脚本在 0 条时以退出码 2 结束），
      # 失败必须可见——静默通过正是这次数据停更 15 天没被发现的原因。
      - name: Fetch AIHOT hot topics
        run: python scripts/fetch_aihot_hot.py
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}

      - name: Fetch AIHOT model leaderboard
        run: python scripts/fetch_model_leaderboard.py

      # 数据检查点：只提交本板块自己的数据文件，绝不碰 docs/。
      # file_pattern 精确列举，避免误提交其他流程的文件。
      - name: Commit AIHOT data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aihot_hot.json data/aihot_hot/ data/model_leaderboard.json
          if git diff --staged --quiet; then
            echo "AIHOT 数据无变化，跳过提交"
          else
            git commit -m "AIHOT 数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
            echo "AIHOT 数据已提交"
          fi
